<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="src/style.css" />
  <title>Ежедневник — Задача</title>
</head>
<body>
  <header class="app-header py-2 px-3 d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-pencil-square fs-4"></i>
      <span class="fw-semibold" id="hdrTitle">Задача: создание/редактирование</span>
    </div>
    <div class="d-flex align-items-center gap-2">
      <span class="badge text-bg-light border" id="whoami"></span>
      <a class="btn btn-sm btn-outline-light" href="tasks.html"><i class="bi bi-arrow-left me-1"></i>Назад</a>
    </div>
  </header>

  <main class="container my-4">
    <div class="row g-3">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <form id="form" class="row g-3">
              <div class="col-12 col-md-4">
                <label class="form-label">Тип записи</label>
                <select class="form-select" id="kind">
                  <option value="task">Задача</option>
                  <option value="event">Событие</option>
                </select>
              </div>

              <div class="col-12 col-md-8">
                <label class="form-label">Заголовок</label>
                <input class="form-control" id="title" placeholder="..." />
                <div class="invalid-feedback">Укажите заголовок (минимум 2 символа).</div>
              </div>

              <div class="col-12">
                <label class="form-label">Описание</label>
                <textarea class="form-control" id="desc" rows="3" placeholder="..."></textarea>
              </div>

              <div class="col-12 col-md-3">
                <label class="form-label">Дата</label>
                <input class="form-control" type="date" id="date" />
                <div class="invalid-feedback">Выберите дату.</div>
              </div>

              <div class="col-12 col-md-3">
                <label class="form-label">Время</label>
                <input class="form-control" type="time" id="time" />
              </div>

              <div class="col-12 col-md-3">
                <label class="form-label">Категория</label>
                <select class="form-select" id="category"></select>
              </div>

              <div class="col-12 col-md-3">
                <label class="form-label">Приоритет</label>
                <select class="form-select" id="priority"></select>
              </div>

              <div class="col-12">
                <label class="form-label">Статус</label>
                <div class="d-flex flex-wrap gap-2" id="statusRadios"></div>
              </div>

              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="remOn">
                  <label class="form-check-label" for="remOn">Напоминание: включить</label>
                </div>
              </div>

              <div class="col-12 col-md-4" id="remMinutesWrap">
                <label class="form-label">За (мин.)</label>
                <input class="form-control" type="number" min="1" max="1440" step="1" id="remMinutes" value="15" />
              </div>

              <div class="col-12">
                <label class="form-label">Повтор</label>
                <div class="d-flex flex-wrap gap-2">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="repeat" id="repNone" value="none" checked>
                    <label class="form-check-label" for="repNone">Нет</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="repeat" id="repDay" value="daily">
                    <label class="form-check-label" for="repDay">Ежедневно</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="repeat" id="repWeek" value="weekly">
                    <label class="form-check-label" for="repWeek">Еженедельно</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="repeat" id="repMonth" value="monthly">
                    <label class="form-check-label" for="repMonth">Ежемесячно</label>
                  </div>
                </div>
              </div>

              <div class="col-12">
                <div class="alert alert-danger d-none" id="err"></div>
              </div>

              <div class="col-12 d-flex flex-wrap gap-2">
                <button class="btn btn-primary" type="submit" id="btnSave"><i class="bi bi-check2-circle me-1"></i>Сохранить</button>
                <a class="btn btn-outline-secondary" href="tasks.html"><i class="bi bi-x-circle me-1"></i>Отмена</a>
                <button class="btn btn-outline-danger ms-auto" type="button" id="btnDelete"><i class="bi bi-trash me-1"></i>Удалить</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h6 class="mb-2">Подсказка</h6>
            <hr/>
            <div class="small text-muted">
              <div><span class="fw-semibold">ID записи:</span> <code id="idLabel">new</code></div>
              <div><span class="fw-semibold">Напоминание (время):</span> <span id="remAt">—</span></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="src/common.js"></script>
  <script src="src/task.js"></script>
</body>
</html>
