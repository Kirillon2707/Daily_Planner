<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="src/style.css" />
  <title>Ежедневник — Список задач</title>
</head>
<body>
  <header class="app-header py-2 px-3 d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-list-check fs-4"></i>
      <span class="fw-semibold">Список задач</span>
    </div>
    <div class="d-flex align-items-center gap-2">
      <span class="badge text-bg-light border" id="whoami"></span>
      <a class="btn btn-sm btn-outline-light" href="today.html"><i class="bi bi-arrow-left me-1"></i>Назад</a>
      <a class="btn btn-sm btn-outline-light" href="task.html"><i class="bi bi-plus-circle me-1"></i>Добавить</a>
    </div>
  </header>

  <main class="container-fluid my-3">
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-md-3">
            <label class="form-label small mb-1">Дата: с</label>
            <input class="form-control" type="date" id="dFrom">
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label small mb-1">по</label>
            <input class="form-control" type="date" id="dTo">
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label small mb-1">Поиск</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input class="form-control" id="q" placeholder="..." />
            </div>
          </div>
          <div class="col-12 col-md-2 d-grid">
            <button class="btn btn-outline-secondary" id="btnReset"><i class="bi bi-arrow-counterclockwise me-1"></i>Сброс</button>
          </div>
        </div>

        <div class="row g-2 mt-1">
          <div class="col-12 col-md-3">
            <label class="form-label small mb-1">Категория</label>
            <select class="form-select" id="fltCat"><option value="">Все</option></select>
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label small mb-1">Приоритет</label>
            <select class="form-select" id="fltPr"><option value="">Все</option></select>
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label small mb-1">Статус</label>
            <select class="form-select" id="fltSt"><option value="">Все</option></select>
          </div>
          <div class="col-12 col-md-3 d-grid">
            <button class="btn btn-dark" id="btnExport"><i class="bi bi-filetype-csv me-1"></i>Экспорт CSV</button>
          </div>
        </div>

        <hr/>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>#</th><th>Дата</th><th>Время</th><th>Заголовок</th><th>Категория</th><th>Приоритет</th><th>Статус</th><th class="text-end">Действия</th>
              </tr>
            </thead>
            <tbody id="tbl"></tbody>
          </table>
        </div>

        <div class="small text-muted" id="stats"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="src/common.js"></script>
  <script src="src/tasks.js"></script>
</body>
</html>
